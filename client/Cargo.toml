[package]
name = "rift-client"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rift-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlImageElement",
  "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "Node", "NodeList", "DomTokenList",
  "CssStyleDeclaration", "Event", "MouseEvent", "PointerEvent", "WheelEvent", "KeyboardEvent", "InputEvent",
  "EventTarget", "AddEventListenerOptions", "Location", "History", "Storage", "Navigator", "Clipboard",
  "WebSocket", "MessageEvent", "CloseEvent", "BinaryType", "DomRect",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlTexture",
  "WebGlUniformLocation", "WebGlVertexArrayObject", "WebGlContextAttributes",
  "CanvasRenderingContext2d", "TextMetrics", "Performance", "Response", "Request", "RequestInit", "Headers",
  "UrlSearchParams", "Url", "console", "CanvasGradient", "DragEvent", "DataTransfer", "ResizeObserver", "ResizeObserverEntry", "MediaQueryList"
]
