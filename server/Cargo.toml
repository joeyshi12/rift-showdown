[package]
name = "rift-server"
version.workspace = true
edition.workspace = true

[dependencies]
rift-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
serde_urlencoded = "0.7"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname", "pool"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
serde_urlencoded = "0.7"
reqwest = { version = "0.12", default-features = false }
